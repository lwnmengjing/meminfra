name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test GO=go

      - name: Build
        run: make build GO=go

      - name: Package linux amd64 artifacts
        run: |
          version="${GITHUB_REF_NAME:-snapshot}"
          package="meminfra_${version}_linux_amd64"
          mkdir -p "dist/$package"
          cp bin/meminfra "dist/$package/"
          cp bin/meminfra-mcp "dist/$package/"
          cp README.md "dist/$package/"
          cp -R docs "dist/$package/docs"
          cp -R script "dist/$package/script"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > checksums.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meminfra-release-linux-amd64
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
              --title "MemInfra $GITHUB_REF_NAME" \
              --generate-notes
          fi
